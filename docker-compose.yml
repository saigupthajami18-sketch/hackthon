version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: placementops-db
    environment:
      POSTGRES_USER: placementops
      POSTGRES_PASSWORD: placementops
      POSTGRES_DB: placementops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementops -d placementops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: placementops-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
